name: GitHub CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Persian translations
        run: npm run translation:check

      - name: Lint source
        run: npm run lint -- --quiet

      - name: Build production application
        run: npm run build

      - name: Run all tests
        run: npm run test:ci -- --watchAll=false
