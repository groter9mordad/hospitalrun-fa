name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths-ignore:
      - ".github/workflows/codeql-analysis.yml"
      - ".github/workflows/ci.yml"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Persian translations
        run: npm run translation:check

      - name: Lint source
        run: npm run lint -- --quiet

      - name: Run all tests
        run: npm run test:ci -- --watchAll=false

      - name: Download and verify CouchDB for offline clinic setup
        shell: pwsh
        run: |
          $version = '3.5.2-1'
          $name = "apache-couchdb-${version}.msi"
          $downloadRoot = "https://couchdb.neighbourhood.ie/downloads/${version}/win"
          $checksumRoot = "https://neighbourhood.ie/download-apache-couchdb/${version}/win"
          $vendor = "deployment/windows/vendor"
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "${downloadRoot}/${name}" -OutFile "${vendor}/${name}"
          Invoke-WebRequest -UseBasicParsing -Uri "${checksumRoot}/${name}.sha256" -OutFile "${vendor}/${name}.sha256"
          $expected = ((Get-Content -Raw "${vendor}/${name}.sha256") -split '\s+')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 "${vendor}/${name}").Hash.ToUpperInvariant()
          if (-not $expected -or $actual -ne $expected) {
            throw 'Bundled CouchDB installer checksum verification failed.'
          }

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Smoke test packaged desktop app
        shell: pwsh
        run: |
          $executable = Resolve-Path "release/win-unpacked/RunCDX.exe"
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "RunCDX exited during the Windows smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Get-Process RunCDX -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Verify bundled CouchDB resource
        shell: pwsh
        run: |
          $bundled = Get-ChildItem "release/win-unpacked/resources/server-tools/vendor/apache-couchdb-*.msi" | Select-Object -First 1
          if (-not $bundled) { throw "CouchDB MSI was not bundled into the packaged app." }
          $checksum = "${bundled}.sha256"
          if (-not (Test-Path $checksum)) { throw "Bundled CouchDB checksum file is missing." }
          $expected = ((Get-Content -Raw $checksum) -split '\s+')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $bundled.FullName).Hash.ToUpperInvariant()
          if (-not $expected -or $actual -ne $expected) {
            throw "Packaged CouchDB MSI checksum verification failed."
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release/RunCDX-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Windows installer was not created." }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content "release/SHA256SUMS.txt" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunCDX-Windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/RunCDX-Setup-*.exe
            release/SHA256SUMS.txt
            deployment/windows/Install-RunCDXServer.ps1
            deployment/windows/README-fa.md

      - name: Publish permanent GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -eq "refs/heads/master") {
            $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
            $releaseTag = "v${version}"
          }
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target $env:GITHUB_SHA --generate-notes --prerelease --title "RunCDX $releaseTag"
          }
          Get-ChildItem "release/RunCDX-Setup-*.exe", "release/SHA256SUMS.txt" |
            ForEach-Object { gh release upload $releaseTag $_.FullName --clobber }
          gh release upload $releaseTag "deployment/windows/Install-RunCDXServer.ps1" --clobber
          gh release upload $releaseTag "deployment/windows/README-fa.md" --clobber